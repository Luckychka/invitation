<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лиза, у меня для тебя кое-что есть</title>
<meta name="description" content="Небольшое приглашение. Выбери, куда пойдём, и когда тебе удобно.">
<meta name="theme-color" content="#f7e8e4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.86em' font-size='80'>&#9993;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>

<main class="stage">
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="backBtn" type="button" aria-label="Назад">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1">
      <div class="progress__bar" id="progressBar"></div>
    </div>
    <span class="counter" id="counter">1/6</span>
  </header>

  <section class="card" id="card" aria-live="polite"></section>

  <p class="hint" id="hint">Нажимай на варианты — двигаться можно и назад</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
